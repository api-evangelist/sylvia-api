name: Sylvia API
description: Sylvia API is a third-party Reddit data API that serves Reddit content as JSON — posts, comments
  with full recursive threads, subreddit and user surfaces, and a live comment feed. Twelve read operations
  cover post and comment search, single-item lookup, subreddit and user timelines, a live comments stream,
  dataset torrents for bulk access, and a usage endpoint. Authentication is an API key. It occupies the
  gap left by Pushshift, giving researchers and developers queryable Reddit history without going through
  OAuth on the first-party API.
