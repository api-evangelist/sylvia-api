aid: sylvia-api
url: https://raw.githubusercontent.com/api-evangelist/sylvia-api/refs/heads/main/apis.yml
name: Sylvia API
description: 'Sylvia API is a third-party Reddit data API that serves Reddit content as JSON — posts,
  comments with full recursive threads, subreddit and user surfaces, global search, and a live comment
  stream. Thirty-six operations across twelve tags cover the read surface (posts, comments, subreddits,
  users, search, domains, discovery and live feeds) plus account self-service: API key issue and revoke,
  response-format templates, usage history and crypto billing. Authentication is an API key for data endpoints
  and a separate account token for account operations. It occupies the gap left by Pushshift, giving researchers
  and developers queryable Reddit history without going through OAuth on the first-party API.'
